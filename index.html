<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Reward Arcade</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;700;900&display=swap');

  :root {
    --bg-top: #1b1033;
    --bg-bot: #0c0818;
    --panel: #241a3d;
    --panel-edge: #4a3578;
    --panel-edge-dark: #150f26;
    --ink: #f2eaff;
    --ink-soft: #ac9fd6;
    --accent: #ff5da2;
    --accent-dark: #c73f7e;
    --accent2: #4de3c1;
    --accent2-dark: #2ba98a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, var(--bg-top) 0%, var(--bg-bot) 65%);
    color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif;
    display: flex;
    justify-content: center;
    padding: 28px 16px 40px;
  }

  #app { width: 100%; max-width: 420px; }

  header { text-align: center; margin-bottom: 24px; }
  .arcade-blocks {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 14px;
  }
  .arcade-blocks span {
    width: 14px; height: 14px;
    border-radius: 3px;
    display: inline-block;
    box-shadow: 0 0 10px currentColor;
  }
  .arcade-blocks span:nth-child(1) { background: var(--accent); color: var(--accent); }
  .arcade-blocks span:nth-child(2) { background: var(--accent2); color: var(--accent2); }
  .arcade-blocks span:nth-child(3) { background: #ffd85e; color: #ffd85e; }

  h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: 16px;
    letter-spacing: 1px;
    margin: 0 0 8px;
    text-shadow: 0 0 14px rgba(255, 93, 162, 0.5);
  }
  header p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 13px;
  }

  .game-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }

  .game-card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: linear-gradient(160deg, var(--panel), #1a1230);
    border: 3px solid var(--panel-edge);
    border-radius: 10px;
    padding: 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: relative;
    overflow: hidden;
    transition: transform 0.08s ease, border-color 0.15s ease;
  }
  .game-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,0.06) 50%, transparent 60%);
    pointer-events: none;
  }
  .game-card:active { transform: scale(0.97); border-color: var(--accent2); }

  .game-icon {
    font-size: 40px;
    width: 64px;
    height: 64px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
    border: 2px solid var(--panel-edge);
  }
  .game-info h2 {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    margin: 0 0 6px;
    color: var(--ink);
  }
  .game-info p {
    margin: 0;
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.5;
  }
  .game-play-tag {
    margin-left: auto;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--accent2);
    white-space: nowrap;
    align-self: center;
  }

  .coming-soon {
    border-style: dashed;
    opacity: 0.55;
    cursor: default;
  }
  .coming-soon .game-play-tag { color: var(--ink-soft); }

  footer {
    text-align: center;
    margin-top: 26px;
    font-size: 11px;
    color: var(--ink-soft);
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="arcade-blocks"><span></span><span></span><span></span></div>
    <h1>REWARD ARCADE</h1>
    <p>選一款遊戲，開始吧！</p>
  </header>

  <div class="game-grid" id="game-grid"></div>

  <footer>玩得開心 🎉</footer>
</div>

<script>
  // Add a new game by adding one entry here — no other file needs to change.
  const GAMES = [
    { icon: '🐤', title: 'FLAPPY ROBLOX', desc: '閃避方塊管道與怪物，飛得越遠分數越高', url: 'flappy-roblox/flappy-roblox.html' }
    // { icon: '🎯', title: 'NEXT GAME', desc: '...', url: 'next-game/next-game.html' }
  ];

  const grid = document.getElementById('game-grid');
  GAMES.forEach(function (game) {
    const a = document.createElement('a');
    a.className = 'game-card';
    a.href = game.url;
    a.innerHTML =
      '<div class="game-icon">' + game.icon + '</div>' +
      '<div class="game-info"><h2>' + game.title + '</h2><p>' + game.desc + '</p></div>' +
      '<div class="game-play-tag">▶ PLAY</div>';
    grid.appendChild(a);
  });
</script>
</body>
</html>
